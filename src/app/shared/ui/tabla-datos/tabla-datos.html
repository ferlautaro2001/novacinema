<div class="contenedor">
  <table>
    <caption class="solo-lector">
      {{
        titulo()
      }}
    </caption>
    <thead>
      <ng-content select="[encabezado]" />
    </thead>
    <tbody>
      @for (fila of filas(); track fila.id) {
        <tr>
          <ng-container
            [ngTemplateOutlet]="plantillaFila()"
            [ngTemplateOutletContext]="{ $implicit: fila }"
          />
        </tr>
      } @empty {
        <tr>
          <td>No hay datos.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
