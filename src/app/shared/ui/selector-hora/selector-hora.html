<!-- Las agendas agotadas no se pueden tocar, pero sí se muestran: el enunciado
     pide verlas para que el cliente sepa que la película tiene funciones ese día
     aunque no pueda comprar en ellas. El estado no se marca solo con el color,
     lleva la palabra "Agotada" al lado. -->
<ul class="opciones" role="group" aria-label="Elegí un horario">
  @for (opcion of opciones(); track opcion.id) {
    <li>
      <button
        type="button"
        class="opcion body-strong"
        [class.elegida]="estaElegida(opcion)"
        [class.agotada]="opcion.agotada"
        [disabled]="opcion.agotada"
        [attr.aria-pressed]="estaElegida(opcion)"
        (click)="elegir(opcion)"
      >
        @if (estaElegida(opcion)) {
          <svg class="tilde" viewBox="0 0 20 20" aria-hidden="true">
            <path d="M5 10.5l3.2 3L15 6.5" />
          </svg>
        }
        <span class="texto">{{ opcion.etiqueta }}</span>
        @if (opcion.agotada) {
          <span class="agotada caption">Agotada</span>
        }
      </button>
    </li>
  } @empty {
    <li class="vacio body">No hay horarios para este día.</li>
  }
</ul>
