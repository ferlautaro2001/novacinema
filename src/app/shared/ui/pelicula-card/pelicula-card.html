<article class="pelicula">
  <img
    [src]="imagenUrl()"
    [alt]="'Portada de ' + pelicula().titulo"
    loading="lazy"
    width="240"
    height="360"
  />
  <div class="contenido">
    <p class="overline">
      {{ pelicula().estado === 'proximamente' ? 'Próximo estreno' : 'Destacada' }}
    </p>
    <h3 class="body-strong">{{ pelicula().titulo }}</h3>
    <div class="metadatos">
      <nc-clasificacion
        [codigo]="pelicula().clasificacion.codigo"
        [edadMinima]="pelicula().clasificacion.edad_minima"
      /><span class="caption">{{ pelicula().duracion_min | duracion }}</span>
    </div>
    <p class="sinopsis body">{{ pelicula().sinopsis }}</p>
    <button
      class="nc-btn nc-btn--secondary"
      (click)="verDetalle.emit()"
      [attr.aria-label]="'Ver detalle de ' + pelicula().titulo"
    >
      Ver detalle
    </button>
  </div>
</article>
