<!-- Marcado único de cada enlace: lo usan todos los grupos del menú. -->
<ng-template #enlace let-e>
  <li>
    <a
      class="enlace body-strong"
      [routerLink]="e.ruta"
      routerLinkActive="activo"
      ariaCurrentWhenActive="page"
    >
      {{ e.texto }}
    </a>
  </li>
</ng-template>

<nav class="navegacion" aria-label="Principal">
  <ul class="lista">
    @for (e of publicos; track e.ruta) {
      <ng-container *ngTemplateOutlet="enlace; context: { $implicit: e }" />
    }

    <!-- Solo cambia lo que se muestra: el acceso lo controlan rolGuard y RLS. -->
    <ng-container *appSiRol="['empleado', 'administrador']; actual: auth.perfil()?.rol">
      <ng-container *ngTemplateOutlet="enlace; context: { $implicit: boleteria }" />
    </ng-container>
    <ng-container *appSiRol="['administrador']; actual: auth.perfil()?.rol">
      <ng-container *ngTemplateOutlet="enlace; context: { $implicit: panel }" />
    </ng-container>
  </ul>
</nav>
