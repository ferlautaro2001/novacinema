<header class="encabezado">
  <div class="contenido">
    <!-- El logo no se usa por debajo de 96 px: en la barra va el nombre en marquesina. -->
    <a class="marca marquee-md" routerLink="/inicio" aria-label="NovaCinema, ir al inicio">
      Nova<span class="marca-acento">Cinema</span>
    </a>
    <nc-navegacion />
    <!-- Mi cuenta y Salir se suman en US-02.04. -->
    <div class="sesion">
      @if (auth.perfil(); as perfil) {
        <span class="saludo body-strong">Hola, {{ perfil.nombre }}</span>
      } @else if (!auth.usuario()) {
        <a class="nc-btn nc-btn--ghost nc-btn--sm" routerLink="/auth/login">Ingresar</a>
        <a class="nc-btn nc-btn--secondary nc-btn--sm" routerLink="/auth/registro">Crear cuenta</a>
      }
    </div>
  </div>
</header>
