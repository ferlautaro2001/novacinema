<header class="encabezado">
  <div class="contenido">
    <!-- El logo no se usa por debajo de 96 px: en la barra va el nombre en marquesina. -->
    <a class="marca marquee-md" routerLink="/inicio" aria-label="NovaCinema, ir al inicio">
      Nova<span class="marca-acento">Cinema</span>
    </a>
    <nc-navegacion />
    <!-- Los accesos de la sesión (ingresar, mi cuenta, salir) se completan en US-02.03 y US-02.04. -->
    @if (!auth.usuario()) {
      <a class="acceso nc-btn nc-btn--secondary nc-btn--sm" routerLink="/auth/registro"
        >Crear cuenta</a
      >
    }
  </div>
</header>
