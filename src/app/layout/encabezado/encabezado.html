<header class="encabezado">
  <div class="contenido">
    <!-- La marca es el lockup entero: NOVA, la claqueta y CINEMA. Va como imagen
         y no como texto para que el dibujo se vea igual en cualquier pantalla.
         El WebP pesa 36 kB contra 130 kB del PNG, que queda de respaldo para los
         navegadores que no lo soportan. -->
    <a class="marca" routerLink="/inicio" aria-label="NovaCinema, ir al inicio">
      <picture>
        <source srcset="novacinema-marca.webp" type="image/webp" />
        <img src="novacinema-marca.png" alt="NovaCinema" width="640" height="139" />
      </picture>
    </a>
    <nc-navegacion />
    <div class="sesion">
      @if (auth.perfil(); as perfil) {
        <span class="saludo body-strong">Hola, {{ perfil.nombre }}</span>
        <a class="nc-btn nc-btn--ghost nc-btn--sm" routerLink="/cuenta/perfil">Mi perfil</a>
        <button
          type="button"
          class="nc-btn nc-btn--secondary nc-btn--sm"
          [disabled]="cerrando()"
          (click)="cerrarSesion()"
        >
          {{ cerrando() ? 'Cerrando…' : 'Cerrar sesión' }}
        </button>
      } @else if (!auth.usuario()) {
        <a class="nc-btn nc-btn--ghost nc-btn--sm" routerLink="/auth/login">Ingresar</a>
        <a class="nc-btn nc-btn--secondary nc-btn--sm" routerLink="/auth/registro">Crear cuenta</a>
      }
    </div>
    <nc-campana-notificaciones />
    @if (error(); as mensaje) {
      <p class="error caption" role="alert">{{ mensaje }}</p>
    }
  </div>
</header>
