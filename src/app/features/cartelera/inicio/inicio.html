<h1 class="marquee-lg">Inicio</h1>
<nc-mas-vendidas (verDetalle)="detalleId.set($event)" />
@if (error()) {
  <div class="aviso" role="alert">
    <p class="body">No se pudieron cargar las películas destacadas.</p>
    <button type="button" class="nc-btn nc-btn--secondary" (click)="cargar()">Reintentá</button>
  </div>
} @else if (hayDestacadas()) {
  <section class="destacadas" aria-labelledby="destacadas-titulo">
    <h2 id="destacadas-titulo" class="marquee-md">Destacadas</h2>
    <div class="grilla">
      @for (pelicula of destacadas(); track pelicula.id) {
        <nc-pelicula-card
          [pelicula]="pelicula"
          [imagenUrl]="storage.urlPublica(pelicula.imagen_path)"
          leyenda="Destacada"
          (verDetalle)="detalleId.set(pelicula.id)"
        />
      }
    </div>
  </section>
}
@if (detalleId(); as id) {
  <nc-detalle-pelicula [peliculaId]="id" (cierre)="detalleId.set(null)" />
}
